[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finanzas-cli"
version = "1.2.0"
description = "Controla tus gastos, ingresos y presupuestos desde la terminal, con reportes y CSV."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Luis Castro" }]
keywords = ["finanzas", "gastos", "presupuesto", "sqlite", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.scripts]
finanzas = "finanzas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
